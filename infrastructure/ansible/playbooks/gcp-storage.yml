# GCP Cloud Storage Bucket Provisioning Playbook
#
# This playbook provisions Google Cloud Storage (GCS) buckets for
# Django media and static files in multi-tenant deployments.
#
# Prerequisites:
#   1. Install required Ansible collections:
#      ansible-galaxy collection install google.cloud
#
#   2. Authenticate with GCP:
#      gcloud auth application-default login
#
#   3. Copy an example inventory and customize it, for example:
#      cp inventory/gcp_app.yml.example inventory/gcp_app.yml
#
# Usage:
#   # Create bucket with default settings
#   ansible-playbook -i inventory/gcp_app.yml \
#     playbooks/gcp-storage.yml
#
#   # Create bucket with custom settings
#   ansible-playbook -i inventory/gcp_app.yml \
#     playbooks/gcp-storage.yml \
#     -e gcs_bucket_name=my-bucket \
#     -e gcs_location=us-east1
#
#   # Grant service account permissions
#   ansible-playbook -i inventory/gcp_app.yml \
#     playbooks/gcp-storage.yml \
#     --tags permissions
#
# Tags:
#   - bucket: Bucket creation and configuration
#   - permissions: IAM policy and service account bindings
#   - verify: Verification checks

---
- name: Provision GCS Storage Bucket
  hosts: localhost
  connection: local
  become: false

  vars:
    # Default bucket settings (override in inventory or command line)
    gcs_bucket_name: "{{ gke_gcs_bucket | default('manage2soar') }}"
    gcs_project: "{{ gcp_project | default('manage2soar') }}"
    gcs_location: "{{ gke_gcs_location | default('us-east1') }}"
    gcs_storage_class: "{{ gke_gcs_storage_class | default('STANDARD') }}"
    gcs_import_export_bucket_name: >-
      {{ gke_gcs_import_export_bucket | default(gcs_project ~ '-private-import-export') }}
    # Service account the Django app authenticates as (the principal that must be
    # granted access to these buckets). Override with gke_service_account_email.
    # Default follows the documented production SA naming convention
    # (<project>-django@<project>.iam.gserviceaccount.com); with the default
    # gcs_project of "manage2soar" this resolves to
    # manage2soar-django@manage2soar.iam.gserviceaccount.com. See
    # infrastructure/ansible/docs/gcs-service-accounts.md.
    gcs_service_account: >-
      {{ gke_service_account_email | default(gcs_project ~ '-django@' ~ gcs_project ~ '.iam.gserviceaccount.com') }}

  tasks:
    - name: Ensure bucket exists with uniform access
      tags: [bucket]
      google.cloud.gcp_storage_bucket:
        name: "{{ gcs_bucket_name }}"
        project: "{{ gcs_project }}"
        location: "{{ gcs_location }}"
        storage_class: "{{ gcs_storage_class }}"
        # Uniform bucket-level access (recommended for IAM)
        iam_configuration:
          uniform_bucket_level_access:
            enabled: true
        state: present
        auth_kind: application
      register: bucket_result

    - name: Display bucket information
      tags: [bucket]
      ansible.builtin.debug:
        msg:
          - "Bucket Name: {{ bucket_result.name }}"
          - "Location: {{ bucket_result.location }}"
          - "Self Link: {{ bucket_result.selfLink }}"
          - "Storage Class: {{ bucket_result.storageClass }}"

    - name: Get bucket IAM policy
      tags: [permissions]
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - buckets
          - get-iam-policy
          - "gs://{{ gcs_bucket_name }}"
          - --format=json
      register: gcs_bucket_policy_raw
      changed_when: false

    - name: Parse bucket IAM policy
      tags: [permissions]
      ansible.builtin.set_fact:
        gcs_bucket_policy: "{{ gcs_bucket_policy_raw.stdout | from_json }}"

    - name: Grant service account Storage Object Admin role
      tags: [permissions]
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - buckets
          - add-iam-policy-binding
          - "gs://{{ gcs_bucket_name }}"
          - "--member=serviceAccount:{{ gcs_service_account }}"
          - --role=roles/storage.objectAdmin
      when: >-
        'serviceAccount:' ~ gcs_service_account not in (
          gcs_bucket_policy.bindings
          | selectattr('role', 'equalto', 'roles/storage.objectAdmin')
          | rejectattr('condition', 'defined')
          | map(attribute='members') | list | flatten | default([])
        )

    - name: Display IAM member information
      tags: [permissions]
      ansible.builtin.debug:
        msg:
          - "Role: roles/storage.objectAdmin"
          - "Member: serviceAccount:{{ gcs_service_account }}"
          - "Bucket: {{ gcs_bucket_name }}"

    - name: Verify bucket is accessible
      tags: [verify]
      google.cloud.gcp_storage_bucket_info:
        name: "{{ gcs_bucket_name }}"
        project: "{{ gcs_project }}"
        auth_kind: application
      register: verify_result

    - name: Display verification result
      tags: [verify]
      ansible.builtin.debug:
        msg:
          - "Bucket verification successful"
          - "Bucket name: {{ verify_result.resources[0].name }}"
          - "Location: {{ verify_result.resources[0].location }}"
          - "Uniform bucket-level access: {{ verify_result.resources[0].iamConfiguration.uniformBucketLevelAccess.enabled }}"

    - name: Ensure private import/export bucket exists with uniform access
      tags: [bucket]
      google.cloud.gcp_storage_bucket:
        name: "{{ gcs_import_export_bucket_name }}"
        project: "{{ gcs_project }}"
        location: "{{ gcs_location }}"
        storage_class: "{{ gcs_storage_class }}"
        iam_configuration:
          uniform_bucket_level_access:
            enabled: true
        state: present
        auth_kind: application

    - name: Get private import/export bucket configuration
      tags: [permissions, lifecycle]
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - buckets
          - describe
          - "gs://{{ gcs_import_export_bucket_name }}"
          - --format=json
      register: import_export_bucket_info_raw
      changed_when: false

    - name: Parse private import/export bucket configuration
      tags: [permissions, lifecycle]
      ansible.builtin.set_fact:
        import_export_bucket_info: "{{ import_export_bucket_info_raw.stdout | from_json }}"

    - name: Enforce public access prevention on private import/export bucket
      tags: [permissions]
      ansible.builtin.command:
        argv:
          - gsutil
          - pap
          - set
          - enforced
          - "gs://{{ gcs_import_export_bucket_name }}"
      when: >-
        import_export_bucket_info.iamConfiguration.publicAccessPrevention | default('') != 'enforced'

    - name: Get private import/export bucket IAM policy
      tags: [permissions]
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - buckets
          - get-iam-policy
          - "gs://{{ gcs_import_export_bucket_name }}"
          - --format=json
      register: import_export_bucket_policy_raw
      changed_when: false

    - name: Parse private import/export bucket IAM policy
      tags: [permissions]
      ansible.builtin.set_fact:
        import_export_bucket_policy: "{{ import_export_bucket_policy_raw.stdout | from_json }}"

    - name: Grant application service account access to private import/export bucket
      tags: [permissions]
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - buckets
          - add-iam-policy-binding
          - "gs://{{ gcs_import_export_bucket_name }}"
          - "--member=serviceAccount:{{ gcs_service_account }}"
          - --role=roles/storage.objectAdmin
      when: >-
        'serviceAccount:' ~ gcs_service_account not in (
          import_export_bucket_policy.bindings
          | selectattr('role', 'equalto', 'roles/storage.objectAdmin')
          | rejectattr('condition', 'defined')
          | map(attribute='members') | list | flatten | default([])
        )

    - name: Check for import/export object expiration lifecycle rule
      tags: [lifecycle]
      ansible.builtin.set_fact:
        import_export_lifecycle_exists: >-
          {{
            import_export_bucket_info.lifecycle.rule | default([])
            | selectattr('action.type', 'equalto', 'Delete')
            | selectattr('condition.age', 'equalto', 1)
            | selectattr('condition.matchesPrefix', 'equalto', ['django-import-export/'])
            | list | length > 0
          }}

    - name: Apply import/export object expiration lifecycle policy
      tags: [lifecycle]
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - buckets
          - update
          - "gs://{{ gcs_import_export_bucket_name }}"
          - "--lifecycle-file={{ playbook_dir }}/../files/gcs-import-export-lifecycle.json"
      when: not import_export_lifecycle_exists
