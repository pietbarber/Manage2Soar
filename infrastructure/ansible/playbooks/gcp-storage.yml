# GCP Cloud Storage Bucket Provisioning Playbook
#
# This playbook provisions Google Cloud Storage (GCS) buckets for
# Django media and static files in multi-tenant deployments.
#
# Prerequisites:
#   1. Install required Ansible collections:
#      ansible-galaxy collection install google.cloud
#
#   2. Authenticate with GCP. This playbook needs TWO credential surfaces:
#      a. Application Default Credentials (ADC), used by the google.cloud
#         modules (gcp_storage_bucket):
#         gcloud auth application-default login
#      b. An active gcloud CLI account, used by the `gcloud storage` and
#         `gsutil` tasks. NOTE: ADC does NOT authenticate the gcloud CLI, so
#         the CLI must be authenticated explicitly, e.g.:
#         gcloud auth login
#         # or, for non-interactive use (CI / service account):
#         gcloud auth activate-service-account --key-file=/path/to/key.json
#
#   3. Copy an example inventory and customize it, for example:
#      cp inventory/gcp_app.yml.example inventory/gcp_app.yml
#
# Usage:
#   # Create bucket with default settings
#   ansible-playbook -i inventory/gcp_app.yml \
#     playbooks/gcp-storage.yml
#
#   # Create bucket with custom settings
#   ansible-playbook -i inventory/gcp_app.yml \
#     playbooks/gcp-storage.yml \
#     -e gcs_bucket_name=my-bucket \
#     -e gcs_location=us-east1
#
#   # Grant service account permissions
#   ansible-playbook -i inventory/gcp_app.yml \
#     playbooks/gcp-storage.yml \
#     --tags permissions
#
# Tags:
#   - bucket: Bucket creation and configuration
#   - cors: CORS policy configuration on the bucket
#   - permissions: IAM policy and service account bindings
#   - verify: Verification checks

---
- name: Provision GCS Storage Bucket
  hosts: localhost
  connection: local
  become: false
  # Inventory only defines the "all" group, so group_vars/gcp_app/vars.yml is
  # never auto-loaded; without this, gke_tenants falls back to the stale
  # inline list in inventory/gcp_app.yml (or defaults to []) and the CORS
  # task applies incomplete origins or silently skips.
  vars_files:
    - ../group_vars/gcp_app/vars.yml

  vars:
    # Default bucket settings (override in inventory or command line)
    gcs_bucket_name: "{{ gke_gcs_bucket | default('manage2soar') }}"
    gcs_project: "{{ gcp_project | default('manage2soar') }}"
    gcs_location: "{{ gke_gcs_location | default('us-east1') }}"
    gcs_storage_class: "{{ gke_gcs_storage_class | default('STANDARD') }}"
    gcs_import_export_bucket_name: >-
      {{ gke_gcs_import_export_bucket | default(gcs_project ~ '-private-import-export') }}
    # Service account the Django app authenticates as (the principal that must be
    # granted access to these buckets). Override with gke_service_account_email.
    # Default follows the documented production SA naming convention
    # (<project>-django@<project>.iam.gserviceaccount.com); with the default
    # gcs_project of "manage2soar" this resolves to
    # manage2soar-django@manage2soar.iam.gserviceaccount.com. See
    # infrastructure/ansible/docs/gcs-service-accounts.md.
    gcs_service_account: >-
      {{ gke_service_account_email | default(gcs_project ~ '-django@' ~ gcs_project ~ '.iam.gserviceaccount.com') }}
    # Active tenants only (issue #1089, PR review). The tenant-lifecycle contract
    # (infrastructure/ansible/docs/tenant-lifecycle.md) and the SSL cert playbook
    # (update-ssl-cert.yml) both exclude `suspended`/`retired` tenants from
    # normal routing and TLS domains; bucket CORS must follow the same rule so
    # suspending or retiring a tenant removes its origin from the bucket policy
    # on the next run. Entries without a `status` key are treated as active for
    # backward compatibility, matching the pattern used by update-ssl-cert.yml.
    gcs_active_tenants: >-
      {{
        (gke_tenants | default([]) | rejectattr('status', 'defined') | list)
        +
        (gke_tenants | default([]) | selectattr('status', 'equalto', 'active') | list)
      }}
    # CORS allowed origins (issue #1089). Derived solely from the *active*
    # tenant domain list in group_vars (gcs_active_tenants[].domains /
    # gcs_active_tenants[].domain), which is the multi-tenant source of truth
    # and mirrors the club domain stored in SiteConfiguration
    # (domain_name / canonical_url). Bare domains are prefixed with https://
    # and de-duplicated into the single-origin list the gcp_storage_bucket
    # module expects. No tenant is hardcoded here — this playbook must remain
    # tenant-agnostic; run against an inventory/group_vars that defines
    # gke_tenants (as the rest of this playbook already requires).
    gcs_cors_origins: >-
      {{ (
         (gcs_active_tenants | default([]) | selectattr('domains', 'defined') | map(attribute='domains') | list | flatten)
         + (gcs_active_tenants | default([]) | selectattr('domain', 'defined') | map(attribute='domain') | list)
       )
       | map('string')
       | reject('eq', '')
       | map('regex_replace', '^(?!https?://)', 'https://')
       | unique
       | list }}
    # The single CORS rule object (issue #1089) as a GCS-API-shaped JSON
    # document consumed by `gcloud storage buckets update --cors-file`.
    # Note the camelCase keys (responseHeader / maxAgeSeconds) — these are the
    # field names the GCS API and the gcloud CLI expect (the Ansible module
    # translates snake_case to this form internally, so the spelling only
    # differs when we talk to the CLI directly).
    gcs_cors_rule:
      - origin: "{{ gcs_cors_origins }}"
        method:
          - GET
        responseHeader:
          - Content-Type
        maxAgeSeconds: 3600
    # The CORS JSON file passed to `gcloud storage buckets update --cors-file`.
    # Rendered on demand into the controller's temp dir by the `Render bucket
    # CORS policy file` task (issue #1089, PR review) — keeping the PR's
    # "no static files" acceptance criterion: no `cors*.json` is committed,
    # and no domain is hardcoded in the playbook.
    gcs_cors_file: "{{ (ansible_env.TMPDIR | default(ansible_env.TEMP | default('/tmp'))) | regex_replace('/$', '') ~ '/gcs-bucket-cors.json' }}"

  tasks:
    # The `gcloud storage` and `gsutil` tasks below authenticate with an active
    # gcloud CLI account. ADC (`gcloud auth application-default login`) does NOT
    # authenticate the gcloud CLI, so verify the CLI account exists up front and
    # fail with an actionable message instead of a cryptic error mid-playbook.
    - name: Check for an active gcloud CLI account
      tags: [permissions, verify, lifecycle]
      ansible.builtin.command:
        argv:
          - gcloud
          - auth
          - list
          - --filter=status:ACTIVE
          - --format=value(account)
      register: gcloud_cli_accounts
      changed_when: false

    - name: Fail if no active gcloud CLI account is configured
      tags: [permissions, verify, lifecycle]
      ansible.builtin.fail:
        msg: >-
          No active gcloud CLI account found. The `gcloud storage` and `gsutil`
          tasks in this playbook authenticate with a gcloud CLI account, which is
          NOT covered by ADC (`gcloud auth application-default login`). Run
          `gcloud auth login` (or `gcloud auth activate-service-account
          --key-file=<key>.json` for non-interactive use) and re-run.
      when: (gcloud_cli_accounts.stdout | trim | length) == 0

    - name: Ensure bucket exists with uniform access
      tags: [bucket]
      google.cloud.gcp_storage_bucket:
        name: "{{ gcs_bucket_name }}"
        project: "{{ gcs_project }}"
        location: "{{ gcs_location }}"
        storage_class: "{{ gcs_storage_class }}"
        # Uniform bucket-level access (recommended for IAM)
        iam_configuration:
          uniform_bucket_level_access:
            enabled: true
        state: present
        auth_kind: application
      register: bucket_result

    - name: Display bucket information
      tags: [bucket]
      ansible.builtin.debug:
        msg:
          - "Bucket Name: {{ bucket_result.name }}"
          - "Location: {{ bucket_result.location }}"
          - "Self Link: {{ bucket_result.selfLink }}"
          - "Storage Class: {{ bucket_result.storageClass }}"

    # CORS policy (issue #1089). Applied via the gcloud CLI rather than the
    # google.cloud.gcp_storage_bucket Ansible module, because (per PR review of
    # this PR):
    #   1. The module's `update` path issues a full HTTP PUT that drops all
    #      unsupplied bucket fields (labels, lifecycle, logging, IAM,
    #      versioning, website), which can reset configuration managed by other
    #      tasks or other tooling. The gcloud CLI's `--cors-file` performs a
    #      partial PATCH that touches only the CORS field.
    #   2. The module's request serializer drops falsy values, so an empty
    #      `cors` list (no active tenants) is silently omitted from the PUT
    #      body and cannot revoke a previously-set CORS policy. The CLI's
    #      `--clear-cors` does this correctly.
    # Idempotency: read the live CORS policy and compare before mutating, so a
    # re-run against an already-correct bucket is a no-op (preserving the PR's
    # "re-run shows no diff" criterion). No domain is hardcoded.
    - name: Get current bucket CORS policy
      tags: [cors]
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - buckets
          - describe
          - "gs://{{ gcs_bucket_name }}"
          - --format=json(cors)
      register: gcs_cors_current_raw
      changed_when: false

    - name: Parse current bucket CORS policy
      tags: [cors]
      ansible.builtin.set_fact:
        # `describe --format=json(cors)` may emit an empty string or `null` when
        # the bucket has no CORS; normalize all of {empty, null, list} to a
        # list so the idempotency comparison below never sees a non-list.
        gcs_cors_current: >-
          {{ (gcs_cors_current_raw.stdout | trim | default('[]', true))
             | from_json
             | default([], true) }}

    - name: Determine whether bucket CORS already matches the desired state
      tags: [cors]
      ansible.builtin.set_fact:
        # method/responseHeader/maxAgeSeconds are constant in this playbook
        # (GET / Content-Type / 3600), so comparing the flattened set of
        # authorized origins is a complete idempotency check. Flattening
        # handles the empty case (no active tenants -> [] == []) and sorting
        # makes it robust to origin-list ordering and rule splitting.
        gcs_cors_unchanged: >-
          {{
            (gcs_cors_current | map(attribute='origin') | list | flatten | sort | list | to_json)
            ==
            (gcs_cors_rule | map(attribute='origin') | list | flatten | sort | list | to_json)
          }}

    - name: Render desired bucket CORS policy file
      tags: [cors]
      when: gcs_cors_origins | length > 0
      ansible.builtin.copy:
        content: "{{ gcs_cors_rule | to_json(indent=2) }}"
        dest: "{{ gcs_cors_file }}"
        mode: "0600"

    - name: Apply bucket CORS policy (non-empty origins)
      tags: [cors]
      when:
        - gcs_cors_origins | length > 0
        - not gcs_cors_unchanged
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - buckets
          - update
          - "gs://{{ gcs_bucket_name }}"
          - "--cors-file={{ gcs_cors_file }}"
      register: bucket_cors_apply_result
      changed_when: true

    - name: Clear bucket CORS policy (no active tenants with domains)
      tags: [cors]
      when:
        - gcs_cors_origins | length == 0
        - not gcs_cors_unchanged
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - buckets
          - update
          - "gs://{{ gcs_bucket_name }}"
          - --clear-cors
      register: bucket_cors_clear_result
      changed_when: true

    - name: Get bucket IAM policy
      tags: [permissions]
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - buckets
          - get-iam-policy
          - "gs://{{ gcs_bucket_name }}"
          - --format=json
      register: gcs_bucket_policy_raw
      changed_when: false

    - name: Parse bucket IAM policy
      tags: [permissions]
      ansible.builtin.set_fact:
        gcs_bucket_policy: "{{ gcs_bucket_policy_raw.stdout | from_json }}"

    - name: Grant service account Storage Object Admin role
      tags: [permissions]
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - buckets
          - add-iam-policy-binding
          - "gs://{{ gcs_bucket_name }}"
          - "--member=serviceAccount:{{ gcs_service_account }}"
          - --role=roles/storage.objectAdmin
      when: >-
        'serviceAccount:' ~ gcs_service_account not in (
          gcs_bucket_policy.bindings
          | selectattr('role', 'equalto', 'roles/storage.objectAdmin')
          | rejectattr('condition', 'defined')
          | map(attribute='members') | list | flatten | default([])
        )

    - name: Display IAM member information
      tags: [permissions]
      ansible.builtin.debug:
        msg:
          - "Role: roles/storage.objectAdmin"
          - "Member: serviceAccount:{{ gcs_service_account }}"
          - "Bucket: {{ gcs_bucket_name }}"

    - name: Verify bucket is accessible
      tags: [verify]
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - buckets
          - describe
          - "gs://{{ gcs_bucket_name }}"
          - --format=json
      register: verify_result
      changed_when: false

    - name: Display verification result
      tags: [verify]
      ansible.builtin.debug:
        msg:
          - "Bucket verification successful"
          - "Bucket name: {{ (verify_result.stdout | from_json).name }}"
          - "Location: {{ (verify_result.stdout | from_json).location }}"
          - "Uniform bucket-level access: {{ (verify_result.stdout | from_json).uniform_bucket_level_access | default('unknown') }}"

    - name: Ensure private import/export bucket exists with uniform access
      tags: [bucket]
      google.cloud.gcp_storage_bucket:
        name: "{{ gcs_import_export_bucket_name }}"
        project: "{{ gcs_project }}"
        location: "{{ gcs_location }}"
        storage_class: "{{ gcs_storage_class }}"
        iam_configuration:
          uniform_bucket_level_access:
            enabled: true
        state: present
        auth_kind: application

    - name: Get private import/export bucket configuration
      tags: [permissions, lifecycle]
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - buckets
          - describe
          - "gs://{{ gcs_import_export_bucket_name }}"
          - --format=json
      register: import_export_bucket_info_raw
      changed_when: false

    - name: Parse private import/export bucket configuration
      tags: [permissions, lifecycle]
      ansible.builtin.set_fact:
        import_export_bucket_info: "{{ import_export_bucket_info_raw.stdout | from_json }}"

    - name: Enforce public access prevention on private import/export bucket
      tags: [permissions]
      ansible.builtin.command:
        argv:
          - gsutil
          - pap
          - set
          - enforced
          - "gs://{{ gcs_import_export_bucket_name }}"
      when: >-
        import_export_bucket_info.iamConfiguration.publicAccessPrevention | default('') != 'enforced'

    - name: Get private import/export bucket IAM policy
      tags: [permissions]
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - buckets
          - get-iam-policy
          - "gs://{{ gcs_import_export_bucket_name }}"
          - --format=json
      register: import_export_bucket_policy_raw
      changed_when: false

    - name: Parse private import/export bucket IAM policy
      tags: [permissions]
      ansible.builtin.set_fact:
        import_export_bucket_policy: "{{ import_export_bucket_policy_raw.stdout | from_json }}"

    - name: Grant application service account access to private import/export bucket
      tags: [permissions]
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - buckets
          - add-iam-policy-binding
          - "gs://{{ gcs_import_export_bucket_name }}"
          - "--member=serviceAccount:{{ gcs_service_account }}"
          - --role=roles/storage.objectAdmin
      when: >-
        'serviceAccount:' ~ gcs_service_account not in (
          import_export_bucket_policy.bindings
          | selectattr('role', 'equalto', 'roles/storage.objectAdmin')
          | rejectattr('condition', 'defined')
          | map(attribute='members') | list | flatten | default([])
        )

    - name: Check for import/export object expiration lifecycle rule
      tags: [lifecycle]
      ansible.builtin.set_fact:
        import_export_lifecycle_exists: >-
          {{
            import_export_bucket_info.lifecycle.rule | default([])
            | selectattr('action.type', 'equalto', 'Delete')
            | selectattr('condition.age', 'equalto', 1)
            | selectattr('condition.matchesPrefix', 'equalto', ['django-import-export/'])
            | list | length > 0
          }}

    - name: Apply import/export object expiration lifecycle policy
      tags: [lifecycle]
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - buckets
          - update
          - "gs://{{ gcs_import_export_bucket_name }}"
          - "--lifecycle-file={{ playbook_dir }}/../files/gcs-import-export-lifecycle.json"
      when: not import_export_lifecycle_exists
