---
# M2S Django Application defaults
# These can be overridden in group_vars or host_vars

# Application settings
m2s_app_user: "m2s"
m2s_app_group: "m2s"
m2s_app_home: "/opt/m2s"
m2s_app_name: "manage2soar"

# Repository settings
m2s_git_repo: "https://github.com/pietbarber/Manage2Soar.git"
m2s_git_branch: "main"
m2s_git_force_update: false

# Python settings
m2s_python_version: "python3.12"
m2s_venv_path: "{{ m2s_app_home }}/venv"

# Django settings
m2s_django_settings_module: "manage2soar.settings_single_host"
m2s_django_debug: false
m2s_django_allowed_hosts: "{{ m2s_domain }}"
m2s_django_static_root: "/var/www/m2s/static"
m2s_django_media_root: "/var/www/m2s/media"
# Match the active GKE Django CronJobs on single-host installations. Calendar
# expressions specify UTC explicitly, independently of the server's timezone.
m2s_scheduled_jobs:
  - name: clearsessions
    calendar: "*-*-* 03:00:00 UTC"
    timeout: 300
  - name: notify-aging-logsheets
    command: notify_aging_logsheets
    calendar: "*-*-* 08:00:00 UTC"
    timeout: 900
  - name: process-finalization-email-outbox
    command: process_finalization_email_outbox
    arguments: "--limit=200"
    calendar: "*-*-* *:00/10:00 UTC"
    timeout: 600
  - name: process-stats-dump-outbox
    command: process_stats_dump_outbox
    arguments: "--limit=20"
    calendar: "*-*-* *:00/10:00 UTC"
    timeout: 1200
  - name: send-duty-preop-emails
    command: send_duty_preop_emails
    calendar: "*-*-* 06:00:00 UTC"
    timeout: 600
  - name: send-instructor-summary-emails
    command: send_instructor_summary_emails
    arguments: "--hours-ahead=48"
    calendar: "*-*-* 06:00:00 UTC"
    timeout: 600
  - name: expire-ad-hoc-days
    command: expire_ad_hoc_days
    calendar: "*-*-* *:00/15:00 UTC"
    timeout: 300
  - name: notify-late-sprs
    command: notify_late_sprs
    calendar: "Mon *-*-* 10:00:00 UTC"
    timeout: 1200
  - name: report-duty-delinquents
    command: report_duty_delinquents
    calendar: "*-*-01 07:00:00 UTC"
    timeout: 1800
# Private, non-web-served storage for django-import-export temp files.
# Deliberately OUTSIDE /var/www/m2s/media so Nginx does not expose member
# import CSVs over the public /media/ URL (issue #1071).
m2s_import_export_tmp_dir: "{{ m2s_app_home }}/import-export-tmp"
# Retention (days) for import/export temp files. django-import-export removes
# an object only after the confirmation request is processed, so uploads
# abandoned at the preview step must be expired separately. Mirrors the 1-day
# GCS lifecycle rule applied to the private import/export bucket.
m2s_import_export_retention_days: 1

# Gunicorn settings
m2s_gunicorn_bind: "127.0.0.1:8000"
m2s_gunicorn_workers: 3
m2s_gunicorn_worker_class: "sync"
m2s_gunicorn_timeout: 120
m2s_gunicorn_max_requests: 1000
m2s_gunicorn_max_requests_jitter: 50

# Log settings
m2s_log_dir: "/var/log/m2s"
m2s_gunicorn_access_log: "{{ m2s_log_dir }}/gunicorn-access.log"
m2s_gunicorn_error_log: "{{ m2s_log_dir }}/gunicorn-error.log"
m2s_django_log_file: "{{ m2s_log_dir }}/django.log"

# Database connection (defaults - override in vault)
m2s_db_host: "localhost"
m2s_db_port: 5432
m2s_db_name: "{{ postgresql_database }}"
m2s_db_user: "{{ postgresql_user }}"

# Email settings (defaults)
m2s_email_backend: "django.core.mail.backends.smtp.EmailBackend"
m2s_email_host: "localhost"
m2s_email_port: 587
m2s_email_use_tls: false

# Google OAuth settings (override in vault)
m2s_google_oauth_enabled: true

# Hourly django-axes cleanup (issue #1110).
# On single-host deployments the ``m2s-app`` role is responsible for running
# ``cleanup_login_attempts`` on a schedule (the GKE deployment does this via a
# CronJob in k8s-cronjobs.yaml, so this flag is a no-op there).  When enabled
# the role deploys and starts the ``m2s-cleanup-login-attempts.timer``
# (hourly, minute 0 — mirroring the K8s CronJob) which runs the cleanup as the
# application user through the ``manage.sh`` wrapper.  Set to ``false`` to
# opt out (e.g. to run cleanup manually or from an external scheduler).
m2s_cleanup_login_attempts_enabled: true

# Additional Django environment variables
m2s_extra_env_vars: {}
