---
# ============================================================
# Postfix Role - MTA Setup
# ============================================================

- name: Validate mail domain before rendering Postfix configuration
  ansible.builtin.assert:
    that:
      - mail_domain is defined
      - mail_domain is match('^[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?(?:\\.[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)+$')
    fail_msg: "mail_domain must be a valid DNS name with no path or regex metacharacters."
  tags: [always]

- name: Validate tenant prefixes and domains before rendering Postfix configuration
  ansible.builtin.assert:
    that:
      - (item.prefix | default('')) is string
      - (item.prefix | default('')) == (item.prefix | default('') | lower)
      - (item.prefix | default('')) is match('^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$')
      - _tenant_domains | reject('match', '^[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?(?:\\.[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)+$') | list | length == 0
    fail_msg: "Each club prefix and domain must be a valid DNS-safe value."
  vars:
    _explicit_domains: "{{ [item.domains] if (item.domains is defined and item.domains is string) else (item.domains | default([])) }}"
    _tenant_domains: >-
      {{ _explicit_domains if
         ((item.use_explicit_domains_only | default(false) | bool) and (_explicit_domains | length > 0))
         else ([(item.prefix | default('')) ~ '.' ~ mail_domain] + _explicit_domains) }}
  loop: "{{ club_domains | default([]) }}"
  loop_control:
    label: "{{ item.prefix | default('missing-prefix') }}"
  tags: [always]

- name: Resolve tenant domains for uniqueness validation
  ansible.builtin.set_fact:
    postfix_resolved_tenant_domains: "{{ ((postfix_resolved_tenant_domains | default([])) + (_tenant_domains | map('lower') | unique | list)) | unique | list }}"
  vars:
    _explicit_domains: "{{ [item.domains] if (item.domains is defined and item.domains is string) else (item.domains | default([])) }}"
    _tenant_domains: >-
      {{ _explicit_domains if
         ((item.use_explicit_domains_only | default(false) | bool) and (_explicit_domains | length > 0))
         else ([(item.prefix | default('')) ~ '.' ~ mail_domain] + _explicit_domains) }}
  loop: "{{ club_domains | default([]) }}"
  loop_control:
    label: "{{ item.prefix | default('missing-prefix') }}"
  tags: [always]

- name: Reject duplicate tenant prefixes and domains
  ansible.builtin.assert:
    that:
      - (club_domains | map(attribute='prefix') | list | unique | length) == (club_domains | length)
      - (postfix_resolved_tenant_domains | default([]) | unique | length) == (postfix_resolved_tenant_domains | default([]) | length)
    fail_msg: "Tenant prefixes and resolved mail domains must be unique."
  tags: [always]

- name: Install Postfix and SASL
  ansible.builtin.apt:
    name:
      - postfix
      - postfix-pcre
      - libsasl2-modules
      - sasl2-bin
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Create dedicated mailing-list filter account
  ansible.builtin.user:
    name: "{{ postfix_filter_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    groups: postfix
    append: true

- name: Create Postfix main.cf
  ansible.builtin.template:
    src: main.cf.j2
    dest: "{{ postfix_config_dir }}/main.cf"
    mode: "0644"
    backup: true
  notify: Restart Postfix

- name: Create Postfix master.cf
  ansible.builtin.template:
    src: master.cf.j2
    dest: "{{ postfix_config_dir }}/master.cf"
    mode: "0644"
    backup: true
  notify: Restart Postfix

- name: Create header_checks (From rewriting for mailing lists)
  ansible.builtin.template:
    src: header_checks.j2
    dest: "{{ postfix_config_dir }}/header_checks"
    mode: "0644"
  notify: Reload Postfix

- name: Create smtp_header_checks (List headers for outbound mail)
  ansible.builtin.template:
    src: smtp_header_checks.j2
    dest: "{{ postfix_config_dir }}/smtp_header_checks"
    mode: "0644"
  notify: Reload Postfix

- name: Validate Postfix configuration
  ansible.builtin.command:
    cmd: postfix check
  changed_when: false

- name: Create virtual alias domains file
  ansible.builtin.template:
    src: virtual_domains.j2
    dest: "{{ postfix_config_dir }}/virtual_domains"
    group: postfix
    mode: "0640"
  notify: Postmap virtual domains

- name: Create initial empty virtual aliases file
  ansible.builtin.copy:
    dest: "{{ postfix_config_dir }}/virtual"
    content: |
      # Virtual aliases - generated by m2s-sync-aliases.py
      # DO NOT EDIT MANUALLY - will be overwritten
      #
      # Format: alias@domain.com  recipient1@gmail.com,recipient2@yahoo.com
    group: postfix
    mode: "0640"
    force: false # Don't overwrite if exists
  notify: Postmap virtual aliases

- name: Create per-tenant sender whitelist directory
  ansible.builtin.file:
    path: "{{ postfix_whitelist_dir }}"
    state: directory
    owner: root
    group: postfix
    mode: "0750"

- name: Create per-tenant sender whitelist files
  ansible.builtin.copy:
    dest: "{{ postfix_whitelist_dir }}/{{ item.prefix }}_whitelist"
    content: |
      # Sender whitelist for {{ item.prefix }} - generated by m2s-mail-sync.py
      # DO NOT EDIT MANUALLY - will be overwritten
    owner: root
    group: postfix
    mode: "0640"
    force: false
  loop: "{{ club_domains | default([]) }}"
  loop_control:
    label: "{{ item.prefix }}"

- name: Postmap per-tenant sender whitelist files
  ansible.builtin.command:
    cmd: "/usr/sbin/postmap {{ postfix_whitelist_dir }}/{{ item.prefix }}_whitelist"
  changed_when: true
  loop: "{{ club_domains | default([]) }}"
  loop_control:
    label: "{{ item.prefix }}"

- name: Secure per-tenant sender whitelist databases
  ansible.builtin.file:
    path: "{{ postfix_whitelist_dir }}/{{ item.prefix }}_whitelist.db"
    owner: root
    group: postfix
    mode: "0640"
  loop: "{{ club_domains | default([]) }}"
  loop_control:
    label: "{{ item.prefix }}"

- name: Remove legacy global sender whitelist files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ postfix_config_dir }}/sender_whitelist"
    - "{{ postfix_config_dir }}/sender_whitelist.db"

- name: Create recipient whitelist check file
  ansible.builtin.copy:
    dest: "{{ postfix_config_dir }}/recipient_whitelist_check"
    content: |
      # Recipient whitelist check - generated by m2s-sync-aliases.py
      # DO NOT EDIT MANUALLY - will be overwritten
      #
      # Format: recipient@email.com  whitelist_required_<tenant>
    group: postfix
    mode: "0640"
    force: false
  notify: Postmap recipient whitelist check

- name: Create SASL password database
  ansible.builtin.template:
    src: sasl_passwd.j2
    dest: "{{ postfix_config_dir }}/sasl_passwd"
    mode: "0600"
  notify: Postmap SASL passwords

# ============================================================
# SASL Authentication for M2S Django App
# ============================================================
# We use auxprop with sasldb (not saslauthd) because Postfix runs
# in a chroot and can't access the saslauthd socket. The sasldb
# file is copied into the chroot.

- name: Create SASL config directory in Postfix chroot
  ansible.builtin.file:
    path: /var/spool/postfix/etc/sasl2
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure SASL authentication (auxprop with sasldb)
  ansible.builtin.copy:
    dest: /var/spool/postfix/etc/sasl2/smtpd.conf
    content: |
      # SASL config for Postfix submission (port 587)
      # Uses sasldb for password lookup (not saslauthd)
      pwcheck_method: auxprop
      auxprop_plugin: sasldb
      mech_list: plain login
      # Path is relative to Postfix chroot (/var/spool/postfix)
      # Actual file location: /var/spool/postfix/etc/sasldb2
      sasldb_path: /etc/sasldb2
    mode: "0644"
  notify: Reload Postfix

- name: Create SASL users in sasldb
  ansible.builtin.shell: |
    if ! sasldblistusers2 2>/dev/null | grep -q "{{ item.username }}@{{ mail_domain }}"; then
      echo "{{ item.password }}" | saslpasswd2 -p -c -u {{ mail_domain }} {{ item.username }}
      echo "created"
    fi
  loop: "{{ smtp_auth_users }}"
  no_log: true
  register: sasl_result
  changed_when: "'created' in sasl_result.stdout"
  notify: Copy sasldb to chroot
  when: smtp_auth_users is defined and smtp_auth_users | length > 0

- name: Copy sasldb to Postfix chroot
  ansible.builtin.copy:
    src: /etc/sasldb2
    dest: /var/spool/postfix/etc/sasldb2
    remote_src: true
    owner: root
    group: postfix
    mode: "0640"
  when: smtp_auth_users is defined and smtp_auth_users | length > 0

- name: Install mailing list header rewriter script
  ansible.builtin.template:
    src: maillist-rewriter.py.j2
    dest: /usr/local/bin/maillist-rewriter.py
    mode: "0755"
    owner: root
    group: root
  notify: Restart Postfix

- name: Add postfix to sasl group
  ansible.builtin.user:
    name: postfix
    groups: sasl
    append: true

- name: Ensure Postfix is enabled and running
  ansible.builtin.service:
    name: postfix
    enabled: true
    state: started
