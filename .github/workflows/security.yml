name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly security scan on Sundays at 2 AM UTC
    - cron: "0 2 * * 0"

# Explicit permissions to follow principle of least privilege
permissions:
  contents: read
  pull-requests: write  # For PR comments

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] pip-audit
          # Install project dependencies for comprehensive scanning
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Bandit Security Scan
        run: |
          echo "Running Bandit security scan..."
          bandit --configfile bandit.yaml -r . -f json -o bandit-report.json || true
          bandit --configfile bandit.yaml -r . -f txt || true

      - name: Run pip-audit - Python Package Audit
        run: |
          echo "Auditing Python packages..."
          : > pip-audit.log
          report_valid=false

          for attempt in 1 2 3; do
            rm -f pip-audit-report.json
            if pip-audit --format=json --output=pip-audit-report.json --timeout 60 2>&1 | tee -a pip-audit.log; then
              audit_status=0
            else
              audit_status=$?
            fi

            # pip-audit exits nonzero when it finds vulnerabilities, so accept
            # any valid JSON report regardless of its exit status.
            if [ -s pip-audit-report.json ] && python -m json.tool pip-audit-report.json >/dev/null 2>&1; then
              report_valid=true
              break
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "pip-audit did not produce valid JSON (exit ${audit_status}); retrying in 5 seconds..."
              sleep 5
            fi
          done

          if [ "$report_valid" != true ]; then
            echo "pip-audit failed to produce a valid report after 3 attempts. See pip-audit.log."
            printf '%s\n' '{"error":"pip-audit failed to produce a valid report after 3 attempts; see pip-audit.log."}' > pip-audit-report.json
          fi

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
            pip-audit.log

      - name: Comment PR with Security Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');

            let comment = '## 🔒 Security Scan Results\n\n';

            // Parse Bandit results
            try {
              const banditData = JSON.parse(fs.readFileSync('bandit-report.json', 'utf8'));
              const issues = banditData.results ? banditData.results.length : 0;
              const highSeverity = banditData.results ? banditData.results.filter(r => r.issue_severity === 'HIGH').length : 0;
              const mediumSeverity = banditData.results ? banditData.results.filter(r => r.issue_severity === 'MEDIUM').length : 0;

              comment += `### Bandit Static Analysis\n`;
              comment += `- **Total Issues**: ${issues}\n`;
              comment += `- **High Severity**: ${highSeverity}\n`;
              comment += `- **Medium Severity**: ${mediumSeverity}\n\n`;

              if (highSeverity > 0) {
                comment += `⚠️ **Action Required**: ${highSeverity} high-severity security issues found!\n\n`;
              }
            } catch (e) {
              console.log('Error parsing bandit results:', e.message);
              comment += `### Bandit Static Analysis\n❌ Failed to parse results: ${e.message}\n\n`;
            }

            // Parse pip-audit results
            try {
              const auditData = JSON.parse(fs.readFileSync('pip-audit-report.json', 'utf8'));
              comment += `### Dependency Vulnerability Check\n`;
              if (auditData.error) {
                comment += `❌ **Scan incomplete**: ${auditData.error}\n\n`;
              } else {
                const dependencies = auditData.dependencies || [];
                const vulnerabilities = dependencies.flatMap(dependency =>
                  (dependency.vulns || []).map(vulnerability => ({
                    ...vulnerability,
                    package: dependency.name
                  }))
                );
                const vulnerablePackages = new Set(vulnerabilities.map(vulnerability => vulnerability.package));

                comment += `- **Vulnerable Packages**: ${vulnerablePackages.size}\n`;
                comment += `- **Known Vulnerabilities**: ${vulnerabilities.length}\n\n`;
              }
            } catch (e) {
              console.log('Error parsing pip-audit results:', e.message);
              comment += `### Dependency Vulnerability Check\n❌ Failed to parse pip-audit results: ${e.message}\n\n`;
            }

            comment += `📊 **Full reports available in the Actions artifacts**`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Separate job for failing the build on high-severity issues
  security-gate:
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Security Gate - Fail on High Severity
        run: |
          echo "Running security gate..."
          # Run bandit and capture results in JSON format
          bandit --configfile bandit.yaml -r . -f json -o security-gate-results.json || true

          # Use Python to reliably count high-severity issues
          python3 -c "
          import json
          try:
              with open('security-gate-results.json', 'r') as f:
                  data = json.load(f)
              high_issues = [r for r in data.get('results', []) if r.get('issue_severity') == 'HIGH']
              count = len(high_issues)
              print(f'High-severity issues found: {count}')
              if count > 0:
                  print('❌ Security gate FAILED - {} high-severity issues found!'.format(count))
                  exit(1)
              else:
                  print('✅ Security gate passed - no high-severity issues found.')
          except Exception as e:
              print(f'Error processing results: {e}')
              exit(1)
          "

# Workflow re-trigger to test if security gate issue was transient
